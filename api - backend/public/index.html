<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelpClin API - Status</title>
  <meta name="description" content="Status em tempo real da API HelpClin." />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(17, 24, 39, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --green: #10b981;
      --green-bg: rgba(16, 185, 129, 0.12);
      --yellow: #f59e0b;
      --yellow-bg: rgba(245, 158, 11, 0.12);
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.12);
      --accent: #0284c7;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(2, 132, 199, 0.12), transparent 50%),
        radial-gradient(circle at 50% 80%, rgba(16, 185, 129, 0.08), transparent 50%);
    }

    .status-card {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2.25rem 2rem;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
    }

    /* HEADER */
    .header {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo-badge {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: linear-gradient(135deg, #0284c7, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
      flex-shrink: 0;
    }

    .logo-badge svg {
      width: 26px;
      height: 26px;
      color: #ffffff;
    }

    .title-area h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.01em;
    }

    .title-area p {
      font-size: 0.825rem;
      color: var(--text-muted);
    }

    /* MAIN STATUS BANNER */
    .status-state {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.1rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .pulse-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--green);
      position: relative;
      box-shadow: 0 0 10px var(--green);
    }

    .pulse-dot::after {
      content: '';
      position: absolute;
      top: -3px;
      left: -3px;
      right: -3px;
      bottom: -3px;
      border-radius: 50%;
      border: 2px solid var(--green);
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.6); opacity: 0; }
      100% { transform: scale(0.9); opacity: 0; }
    }

    .status-headline {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.65rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .badge-success {
      background: var(--green-bg);
      color: var(--green);
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-warning {
      background: var(--yellow-bg);
      color: var(--yellow);
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .badge-danger {
      background: var(--red-bg);
      color: var(--red);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    /* SERVICES LIST */
    .services-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .service-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.8rem 1rem;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      font-size: 0.875rem;
    }

    .service-name {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .service-name svg {
      color: var(--text-dim);
    }

    .service-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-main);
    }

    /* FOOTER / ACTIONS */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 0.75rem;
      border-top: 1px solid var(--card-border);
      font-size: 0.775rem;
      color: var(--text-dim);
    }

    .btn-refresh {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.775rem;
      font-family: inherit;
      padding: 0.35rem 0.6rem;
      border-radius: 6px;
      transition: all 0.2s ease;
    }

    .btn-refresh:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="status-card">
    <!-- Header -->
    <div class="header">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2v20M2 12h20"/>
          <circle cx="12" cy="12" r="9" stroke-width="1.8" stroke-dasharray="2 3"/>
        </svg>
      </div>
      <div class="title-area">
        <h1>HelpClin API</h1>
        <p>Status do Servidor e Serviços</p>
      </div>
    </div>

    <!-- Main Status -->
    <div class="status-state">
      <div class="status-left">
        <div class="pulse-dot" id="main-dot"></div>
        <span class="status-headline" id="main-text">Operacional</span>
      </div>
      <span class="badge badge-success" id="main-badge">Online</span>
    </div>

    <!-- Sub Services Status -->
    <div class="services-list">
      <div class="service-row">
        <div class="service-name">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
            <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
            <line x1="6" y1="6" x2="6.01" y2="6"></line>
            <line x1="6" y1="18" x2="6.01" y2="18"></line>
          </svg>
          API Backend
        </div>
        <span class="service-value" id="api-status" style="color: var(--green);">Online</span>
      </div>

      <div class="service-row">
        <div class="service-name">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
            <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
            <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
          </svg>
          Banco PostgreSQL
        </div>
        <span class="service-value" id="db-status" style="color: var(--green);">Conectado</span>
      </div>

      <div class="service-row">
        <div class="service-name">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          Latência
        </div>
        <span class="service-value" id="latency-val">-- ms</span>
      </div>
    </div>

    <!-- Footer -->
    <div class="card-footer">
      <span id="last-update">Atualizado: --:--:--</span>
      <button class="btn-refresh" onclick="checkStatus()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="icon-refresh">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        Atualizar
      </button>
    </div>
  </div>

  <script>
    async function checkStatus() {
      const icon = document.getElementById('icon-refresh');
      if (icon) icon.style.animation = 'spin 0.8s linear infinite';

      const t0 = performance.now();
      let apiOk = false;
      let dbOk = false;

      try {
        const res = await fetch('/api/health', { cache: 'no-store' });
        const latency = Math.round(performance.now() - t0);
        document.getElementById('latency-val').textContent = latency + ' ms';
        apiOk = res.ok;
      } catch {
        document.getElementById('latency-val').textContent = 'Timeout';
      }

      try {
        const dbRes = await fetch('/api/health/db', { cache: 'no-store' });
        if (dbRes.ok) {
          const data = await dbRes.json();
          dbOk = data.status === 'ok';
        }
      } catch {
        dbOk = false;
      }

      const dot = document.getElementById('main-dot');
      const text = document.getElementById('main-text');
      const badge = document.getElementById('main-badge');
      const apiStatus = document.getElementById('api-status');
      const dbStatus = document.getElementById('db-status');

      apiStatus.textContent = apiOk ? 'Online' : 'Offline';
      apiStatus.style.color = apiOk ? 'var(--green)' : 'var(--red)';

      dbStatus.textContent = dbOk ? 'Conectado' : 'Indisponível';
      dbStatus.style.color = dbOk ? 'var(--green)' : 'var(--red)';

      if (apiOk && dbOk) {
        dot.style.background = 'var(--green)';
        dot.style.boxShadow = '0 0 10px var(--green)';
        text.textContent = 'Operacional';
        badge.className = 'badge badge-success';
        badge.textContent = 'Online';
      } else if (apiOk && !dbOk) {
        dot.style.background = 'var(--yellow)';
        dot.style.boxShadow = '0 0 10px var(--yellow)';
        text.textContent = 'Degradação';
        badge.className = 'badge badge-warning';
        badge.textContent = 'Atenção';
      } else {
        dot.style.background = 'var(--red)';
        dot.style.boxShadow = '0 0 10px var(--red)';
        text.textContent = 'Indisponível';
        badge.className = 'badge badge-danger';
        badge.textContent = 'Offline';
      }

      const now = new Date();
      document.getElementById('last-update').textContent = 'Atualizado: ' + now.toLocaleTimeString('pt-BR');

      setTimeout(() => {
        if (icon) icon.style.animation = '';
      }, 400);
    }

    window.addEventListener('DOMContentLoaded', () => {
      checkStatus();
      setInterval(checkStatus, 30000);
    });
  </script>
</body>
</html>
